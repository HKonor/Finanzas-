{% if form.non_field_errors %}<div class="notice notice-error">{{ form.non_field_errors }}</div>{% endif %}
{% for campo in form %}<div class="field"><label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %}<span class="required"> *</span>{% endif %}</label>{{ campo }}{% if campo.help_text %}<small class="hint">{{ campo.help_text|safe }}</small>{% endif %}{% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}</div>{% endfor %}
