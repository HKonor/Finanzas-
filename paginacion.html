{% if items.has_other_pages %}<nav class="pagination" aria-label="Páginas"><span>Página {{ items.number }} de {{ items.paginator.num_pages }} · {{ items.paginator.count }} registros</span><div>{% if items.has_previous %}<a href="{% querystring page=items.previous_page_number %}" class="btn outline">← Anterior</a>{% endif %}{% if items.has_next %}<a href="{% querystring page=items.next_page_number %}" class="btn outline">Siguiente →</a>{% endif %}</div></nav>{% endif %}
